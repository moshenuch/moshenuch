plugins {
    id 'com.android.application'
}

android {
    namespace 'com.moshenuch.c2reborn'
    compileSdk 34

    defaultConfig {
        applicationId "com.moshenuch.c2reborn"
        minSdk 23
        targetSdk 34
        versionCode 18300
        versionName "1.83.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
}
