plugins {
    id 'com.android.application'
}

android {
    namespace 'com.moshenuch.c2reborn'
    compileSdk 34

    defaultConfig {
        applicationId "com.moshenuch.c2reborn"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "0.1-native"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
