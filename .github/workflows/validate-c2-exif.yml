name: Validate C2 Android 6 EXIF fix

on:
  pull_request:
    branches: [main]
    paths:
      - "GPT-c2-from-reborn/app/**"
      - ".github/workflows/validate-c2-exif.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Compile Android APK without publishing
        working-directory: GPT-c2-from-reborn
        run: gradle --no-daemon :app:assembleDebug
      - name: Check API 23 EXIF source compatibility
        shell: bash
        run: |
          set -euo pipefail
          src=GPT-c2-from-reborn/app/src/main/java/com/moshenuch/c2reborn/C2PhoneView.java
          grep -q 'androidx.exifinterface.media.ExifInterface' "$src"
          ! grep -q 'SDK_INT < 24) return source' "$src"
          grep -q "minSdk 23" GPT-c2-from-reborn/app/build.gradle
          grep -q "androidx.exifinterface:exifinterface:1.3.7" GPT-c2-from-reborn/app/build.gradle
      - name: Upload draft APK for validation only
        uses: actions/upload-artifact@v4
        with:
          name: c2-api23-exif-pr-validation
          path: GPT-c2-from-reborn/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  android6-launch:
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/download-artifact@v4
        with:
          name: c2-api23-exif-pr-validation
          path: apk-validation
      - name: Install and launch native app on API 23
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 23
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics
          script: |
            set -eu
            apk="$(find apk-validation -type f -name '*.apk' -print -quit)"
            test -n "$apk"
            adb install -r "$apk"
            adb shell am start -n com.moshenuch.c2reborn/.MainActivity
            sleep 4
            adb shell pidof com.moshenuch.c2reborn
            if adb logcat -d -s AndroidRuntime:E | grep -A 8 'FATAL EXCEPTION' | grep -q 'com.moshenuch.c2reborn'; then
              echo "Native app crashed on Android 6 (API 23)"
              exit 1
            fi
            echo "Android 6 native launch passed; EXIF visual correctness remains untested."
