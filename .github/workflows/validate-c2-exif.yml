name: Validate C2 Android 6 EXIF fix

on:
  pull_request:
    branches: [main]
    paths:
      - "GPT-c2-from-reborn/app/**"
      - ".github/workflows/validate-c2-exif.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Compile Android APK without publishing
        working-directory: GPT-c2-from-reborn
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Check API 23 EXIF source compatibility
        shell: bash
        run: |
          set -euo pipefail
          src=GPT-c2-from-reborn/app/src/main/java/com/moshenuch/c2reborn/C2PhoneView.java
          grep -q 'androidx.exifinterface.media.ExifInterface' "$src"
          ! grep -q 'SDK_INT < 24) return source' "$src"
          grep -q "minSdk 23" GPT-c2-from-reborn/app/build.gradle
          grep -q "androidx.exifinterface:exifinterface:1.3.7" GPT-c2-from-reborn/app/build.gradle
      - name: Audit camera and Gallery EXIF call sites
        run: python3 GPT-c2-from-reborn/tools/audit_api23_exif_wiring.py
      - name: Upload draft APK for validation only
        uses: actions/upload-artifact@v4
        with:
          name: c2-api23-exif-pr-validation
          path: |
            GPT-c2-from-reborn/app/build/outputs/apk/debug/*.apk
            GPT-c2-from-reborn/app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error

  android6-launch:
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/download-artifact@v4
        with:
          name: c2-api23-exif-pr-validation
          path: apk-validation
      - name: Install and launch native app on API 23
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 23
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics
          script: bash GPT-c2-from-reborn/tools/smoke_api23_launch.sh

  android6-exif-image:
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/download-artifact@v4
        with:
          name: c2-api23-exif-pr-validation
          path: apk-validation
      - name: Execute EXIF rotation test on Android 6
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 23
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics
          script: bash GPT-c2-from-reborn/tools/smoke_api23_exif_image.sh

  android11-launch:
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/download-artifact@v4
        with:
          name: c2-api23-exif-pr-validation
          path: apk-validation
      - name: Regression launch on Android 11
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics
          script: bash GPT-c2-from-reborn/tools/smoke_api23_launch.sh

  android11-photo-regression:
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - uses: actions/download-artifact@v4
        with:
          name: c2-api23-exif-pr-validation
          path: apk-validation
      - name: Compile isolated share receiver
        working-directory: GPT-c2-from-reborn
        run: gradle --no-daemon :shareprobe:assembleDebug
      - name: Check saved JPEG, MediaStore indexing and external photo Send on Android 11
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics -camera-back emulated -camera-front emulated
          script: bash GPT-c2-from-reborn/tools/smoke_api23_launch.sh && bash GPT-c2-from-reborn/tools/smoke_photo_emulator.sh
      - name: Upload photo regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c2-api30-photo-regression-diagnostics
          path: GPT-c2-from-reborn/build/emulator-smoke/
          if-no-files-found: warn
