name: Build GPT c2 from reborn APK

on:
  push:
    branches: [ "main" ]
    paths:
      - "GPT-c2-from-reborn/**"
      - ".github/workflows/build-GPT-c2-from-reborn.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build native debug APK
        working-directory: GPT-c2-from-reborn
        run: gradle --no-daemon clean assembleDebug

      - name: Prepare APK
        run: cp GPT-c2-from-reborn/app/build/outputs/apk/debug/app-debug.apk GPT-c2-from-reborn.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: GPT-c2-from-reborn-APK
          path: GPT-c2-from-reborn.apk

      - name: Publish/update public APK release
        uses: ncipollo/release-action@v1
        with:
          tag: c2-native-latest
          name: GPT c2 from reborn - Latest
          body: |
            Native Android build of GPT c2 from reborn, based on the Nokia C2-01 recreation.
            No WebView: the phone shell, menus and interactions are implemented in Android code.
          artifacts: GPT-c2-from-reborn.apk
          allowUpdates: true
          removeArtifacts: true
          replacesArtifacts: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
